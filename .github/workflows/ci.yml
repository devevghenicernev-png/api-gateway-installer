name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: download deps
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build (host)
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/apigw ./cmd/apigw
          ./bin/apigw version

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # v2.x — config schema matches .golangci.yml `version: "2"`.
          # Pin to v2.12.x: the QF1011 / staticcheck checks we reference
          # were added after v2.5, so older v2 patch releases fail
          # `config verify`.
          version: v2.12.2
          args: --timeout=5m

  vuln:
    name: vuln
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    # Static SAST scan. Advisory-only on `main` (continue-on-error: true)
    # so a noisy false-positive in a new dependency cannot wedge the
    # release pipeline overnight; we still get the SARIF output uploaded
    # so findings are visible in the Security tab.
    name: gosec
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: run gosec
        continue-on-error: true
        run: |
          gosec -severity high -confidence medium \
            -exclude-dir=test/e2e \
            -exclude-dir=test/benchmark \
            -fmt=sarif -out=gosec.sarif \
            ./... || true
      - name: upload sarif
        if: always() && hashFiles('gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: '7'
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags='-s -w' -o /tmp/apigw ./cmd/apigw
          file /tmp/apigw
