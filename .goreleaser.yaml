version: 2

project_name: apigw

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: apigw
    main: ./cmd/apigw
    binary: apigw
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/devevghenicernev-png/apigw/internal/build.Version={{ .Version }}
      - -X github.com/devevghenicernev-png/apigw/internal/build.Commit={{ .Commit }}
      - -X github.com/devevghenicernev-png/apigw/internal/build.Date={{ .CommitDate }}
      - -extldflags=-static
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - '7'
    ignore:
      - goos: darwin
        goarch: arm

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.spdx.json"

signs:
  - id: cosign-checksums
    cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '--yes'
      - '${artifact}'
    artifacts: checksum
    output: true

nfpms:
  - id: apigw
    package_name: apigw
    vendor: apigw
    homepage: https://github.com/devevghenicernev-png/apigw
    maintainer: apigw maintainers <noreply@example.com>
    description: API Gateway installer and operator (single binary)
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/apigw/LICENSE

release:
  draft: false
  prerelease: auto
  # If a re-tag (e.g. after a history rewrite) re-runs the workflow,
  # goreleaser otherwise hard-fails on `422 already_exists` for every
  # asset that was uploaded by the previous run. Replacing the existing
  # artifacts keeps the recovery path simple.
  replace_existing_artifacts: true
  github:
    owner: devevghenicernev-png
    name: apigw
  header: |
    ## apigw {{ .Tag }}

    The single-binary API gateway. nginx + Let's Encrypt + GitHub
    deploys + live dashboard — one static Go binary.

    ### Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/devevghenicernev-png/apigw/main/scripts/install.sh | sudo sh
    ```

    Verifies the release with cosign keyless OIDC and sha256 before
    landing the binary at `/usr/local/bin/apigw`.

    ### Verify a download manually

    ```sh
    cosign verify-blob \
      --certificate-identity-regexp "https://github.com/devevghenicernev-png/apigw/.github/workflows/release.yml@.*" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      --certificate checksums.txt.pem \
      --signature   checksums.txt.sig \
      checksums.txt
    sha256sum -c checksums.txt --ignore-missing
    ```
