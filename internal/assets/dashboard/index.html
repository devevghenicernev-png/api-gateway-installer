  <meta name="color-scheme" content="light dark" />
  <!-- The dashboard lives at /dashboard/ on the gateway (see the
       `location /dashboard/ { rewrite ^/dashboard/(.*)$ /$1 break; ... }`
       block written by apigw's nginx template). <base> pins every
       relative URL — assets emitted by Vite AND `fetch("api/admin/...")`
       calls in the bundle — to that mount point. -->
  <base href="/dashboard/" />
  <title>apigw</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="hsl(222.2 47.4% 11.2%)" />
  <script type="module" crossorigin src="/dashboard/assets/index-BCpMKT-K.js"></script>
  <link rel="modulepreload" crossorigin href="/dashboard/assets/ui-BQCqNqg0.js">
  <link rel="modulepreload" crossorigin href="/dashboard/assets/react-aYOpuPz4.js">
  <link rel="stylesheet" crossorigin href="/dashboard/assets/index-CQYdty2W.css">
</head>
<body>
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded focus:bg-primary focus:px-3 focus:py-2 focus:text-primary-foreground">Skip to main content</a>
  <div id="root"></div>
  <noscript>
    <div style="padding: 2rem; font-family: system-ui, -apple-system, sans-serif;">
      <h1>JavaScript required</h1>
      <p>The apigw dashboard is a single-page React app and needs JavaScript to render.</p>
      <p>If you cannot enable JS in your browser, all dashboard actions are also available via the <code>apigw</code> CLI — see <code>apigw --help</code>.</p>
    </div>
  </noscript>
</body>
</html>
